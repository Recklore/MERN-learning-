<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- audio file -->
    <audio src="link" controls></audio>

    <!-- can be used to add multiple audio if one doesnt load other does and it plays and we can also add text at end if nothing loads -->
    <audio controls>
        <source src="link">
    </audio>

    <!-- video file -->
    <video src="have a link" height="400" width="500" controls></video>

    <video controls autoplay muted> 
        <!-- autopay can only be used with muted -->
        <source src="have a link" type="video/mp4">
    </video>


    <!-- iframe, use embed in between the youtube home url and video id  -->
    <iframe src="https://www.youtube.com/embed/1hySUBLmq9Y" frameborder="0" allowfullscreen></iframe>


</body>
</html>
