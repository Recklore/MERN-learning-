<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- html forms -->

    <form action="">
        <fieldset>
            <legend>Testing</legend>

            <label for="name">Name</label>
            <input type="text" id="name" required name="username" placeholder="enter your name">
            
            <br><br>
            
            <label for="age">Age</label>
            <input type="number" id="age" name="userage" value="0">
            
            <br><br>
            
            <label for="texts">Comment</label>
            <textarea name="comments" id="texts" rows="5" cols="20"></textarea>
            
            <br><br>
            
            <label>Gender: </label>
            
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            
            <br><br>
            
            <!-- dropdown -->
            <label for="dep">Department:</label>
            <select name="department" id="dep">
                <option value="none" disabled selected>select your deptartment</option>
                <option value="cse">CSE</option>
                <option value="ece">ECE</option>
            </select>
        
            <br><br>
        
            <input type="checkbox" id="check" name="terms">
            <label for="check">terms and condittions</label>
        
            <br><br>
        
            <button>Submit</button>
        </fieldset>
        
    </form>
    
</body>
</html>
